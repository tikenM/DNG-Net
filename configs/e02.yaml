# E02: adversarial admission rate under mimicry.
# Sweeps adversary fraction in {0.05, 0.10, 0.20, 0.30} via the driver.

experiment:
  name: e02_admission_rate
  seed: 0
  num_seeds: 10
  output_dir: runs/e02/

federation:
  num_clients: 100
  num_clusters: 5
  rounds: 100
  local_epochs: 2
  batch_size: 64
  client_lr: 0.01

data:
  name: synthetic_mixture
  input_dim: 20
  num_classes: 10
  samples_per_client_range: [200, 500]
  intra_cluster_std: 0.5
  inter_cluster_shift: 3.0

adversary:
  fraction_adversarial: 0.10       # driver overrides this per sweep point
  attack_type: mimicry
  mimicry_strength: 1.0
  collusion_fraction: 0.0
  target_cluster: 0

mechanism:
  peer_audit_fanout_c: 3
  gumbel_tau_start: 1.0
  gumbel_tau_end: 0.1
  gumbel_anneal: exponential
  partition_hidden: [64, 64]
  partition_lr: 0.001
  surplus_floor: 0.0001

evaluation:
  bootstrap_iters: 2000

baselines:
  include: [fedavg_kmeans, ifca, fesem, cfl]
